<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sethu Sivan — Cyber Security Engineer">
  <title>Sethu Sivan — Cyber Security Engineer</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B10"/>
      <stop offset="55%" stop-color="#0C1724"/>
      <stop offset="100%" stop-color="#0A1F2B"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="threatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E3A4C" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- ambient glows -->
    <circle cx="950" cy="120" r="220" fill="url(#glow)"/>
    <circle cx="1065" cy="205" r="120" fill="url(#threatGlow)"/>

    <!-- network mesh -->
    <g stroke="#1F4F63" stroke-width="1.2" fill="none" opacity="0.85">
      <path d="M760 180 L860 100"/>
      <path d="M760 180 L865 215"/>
      <path d="M860 100 L985 95"/>
      <path d="M865 215 L985 95"/>
      <path d="M865 215 L950 265"/>
      <path d="M985 95 L1090 150"/>
      <path d="M950 265 L1065 205"/>
      <path d="M1090 150 L1065 205"/>
      <path d="M860 100 L865 215"/>
    </g>

    <!-- traffic flowing along the mesh -->
    <g stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M760 180 L860 100" stroke-dasharray="14 160" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="174" to="0" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <path d="M860 100 L985 95" stroke-dasharray="14 160" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="174" to="0" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>
      </path>
      <path d="M985 95 L1090 150" stroke-dasharray="14 160" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="174" to="0" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M760 180 L865 215" stroke-dasharray="14 160" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="174" to="0" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M865 215 L950 265" stroke-dasharray="14 160" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="174" to="0" dur="2.9s" begin="0.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- the attack path: traffic that gets flagged -->
    <path d="M950 265 L1065 205" stroke="#F43F5E" stroke-width="2.4" fill="none"
          stroke-dasharray="16 140" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="156" to="0" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- healthy nodes -->
    <g fill="#0B1620" stroke="url(#accent)" stroke-width="2">
      <circle cx="760" cy="180" r="7"/>
      <circle cx="860" cy="100" r="7"/>
      <circle cx="985" cy="95" r="7"/>
      <circle cx="865" cy="215" r="7"/>
      <circle cx="950" cy="265" r="7"/>
      <circle cx="1090" cy="150" r="7"/>
    </g>

    <g fill="#2DD4BF">
      <circle cx="860" cy="100" r="3">
        <animate attributeName="opacity" values="1;0.25;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="985" cy="95" r="3">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="180" r="3">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="150" r="3">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.3s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="865" cy="215" r="3">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="950" cy="265" r="3">
        <animate attributeName="opacity" values="1;0.25;1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- detected node -->
    <circle cx="1065" cy="205" r="9" fill="#190910" stroke="#F43F5E" stroke-width="2.4"/>
    <circle cx="1065" cy="205" r="3.5" fill="#F43F5E"/>
    <circle cx="1065" cy="205" r="9" fill="none" stroke="#F43F5E" stroke-width="1.6">
      <animate attributeName="r" from="9" to="34" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.9" to="0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1065" cy="205" r="9" fill="none" stroke="#F43F5E" stroke-width="1.2">
      <animate attributeName="r" from="9" to="34" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>

    <!-- sweeping scan line across the mesh -->
    <rect x="720" y="0" width="3" height="320" fill="url(#sweep)" opacity="0.8">
      <animate attributeName="x" values="720;1180;720" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- left column: identity -->
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">
      <text x="72" y="92" font-size="13" fill="#2DD4BF" letter-spacing="4">&#8226; SYSTEM ONLINE</text>

      <text x="70" y="158" font-size="52" font-weight="700" fill="#F1F5F9" letter-spacing="1">SETHU SIVAN</text>

      <rect x="72" y="178" width="64" height="3" fill="url(#accent)"/>

      <text x="72" y="214" font-size="19" fill="#94A3B8" letter-spacing="5">CYBER SECURITY ENGINEER</text>

      <text x="72" y="256" font-size="13" fill="#64748B" letter-spacing="1">cloud security &#183; platform engineering &#183; detection &amp; response</text>

      <g font-size="11.5" letter-spacing="2">
        <rect x="70" y="274" width="86" height="24" rx="12" fill="none" stroke="#1F4F63"/>
        <text x="113" y="290" fill="#2DD4BF" text-anchor="middle">AWS</text>

        <rect x="164" y="274" width="86" height="24" rx="12" fill="none" stroke="#1F4F63"/>
        <text x="207" y="290" fill="#2DD4BF" text-anchor="middle">WAZUH</text>

        <rect x="258" y="274" width="86" height="24" rx="12" fill="none" stroke="#1F4F63"/>
        <text x="301" y="290" fill="#2DD4BF" text-anchor="middle">SIEM</text>

        <rect x="352" y="274" width="86" height="24" rx="12" fill="none" stroke="#1F4F63"/>
        <text x="395" y="290" fill="#2DD4BF" text-anchor="middle">DFIR</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#1F4F63" stroke-width="1"/>
  </g>
</svg>
